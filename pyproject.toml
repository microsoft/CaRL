[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carl"
version = "0.1.0"
description = "Competence-aware reinforcement learning for LLM tool use"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["carl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
